# Builds, signs and publishes a version of PENSY in the "Releases" page.
#
# How: Actions › "Pubblica una versione" › Run workflow › write the version (e.g. v0.8).
# Pushing a tag v0.8 does the same.
#
# Needs four repository secrets (Settings › Secrets and variables › Actions):
#   KEYSTORE_BASE64    the signing .keystore file, encoded in base64
#   KEYSTORE_PASSWORD  its password
#   KEY_ALIAS          the key alias inside it
#   KEY_PASSWORD       the key password
# Always the same key: that is what lets each new version install over the previous one.
# See docs/PUBBLICARE.md.
name: Pubblica una versione

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versione da pubblicare (per esempio v0.8)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          case "$TAG" in v*) ;; *) echo "::error::La versione deve iniziare con v, per esempio v0.8"; exit 1;; esac
          V="${TAG#v}"
          if ! grep -q "versionName = \"$V\"" android/app/build.gradle.kts; then
            echo "::error::$TAG non corrisponde a versionName in android/app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Kotlin 2.0.21
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kotlinc.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "KOTLINC=$RUNNER_TEMP/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"

      - name: Core tests
        run: sh tools/test-core.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Manca il secret KEYSTORE_BASE64. Istruzioni in docs/PUBBLICARE.md"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/pensy.keystore"
          echo "PENSY_KEYSTORE=$RUNNER_TEMP/pensy.keystore" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          validate-wrappers: false

      - name: Build (release)
        working-directory: android
        env:
          PENSY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PENSY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PENSY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK, signature and checksum
        run: |
          APK="PENSY-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::L'APK è firmato con la chiave di debug: controlla i secret"
            exit 1
          fi
          sha256sum "$APK" > "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## $VERSION" '
            $0 == v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo "**Installare:** scarica \`$APK\` dal telefono e aprilo. Si installa sopra la versione precedente, i dati restano."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$APK.sha256")\`"
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: PENSY ${{ env.VERSION }}
          body_path: notes.md
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
